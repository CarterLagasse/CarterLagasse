name: GitHub Snake Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-green.svg?palette=github-light
            dist/snake-green-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force snake color
        run: |
          sed -i -E 's/(--cs:)[^;}]*/\1#1f6feb/g' dist/snake-green.svg
          sed -i -E 's/(--cs:)[^;}]*/\1#79c0ff/g' dist/snake-green-dark.svg
          echo "Light file:"; grep -o -- '--cs:[^;}]*' dist/snake-green.svg | head -1
          echo "Dark file:"; grep -o -- '--cs:[^;}]*' dist/snake-green-dark.svg | head -1

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"